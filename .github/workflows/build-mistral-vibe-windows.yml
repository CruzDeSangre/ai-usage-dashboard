name: Build Mistral Vibe Windows

on:
  push:
    branches:
      - feature/mistral-vibe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mistral-vibe-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows artifact
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Windows app and installers
        run: npm run app:build

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ai-usage-dashboard-mistral-vibe-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/ai-usage-dashboard.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
